# (ii) privileged verifier: workflow_run => runs the DEFAULT-BRANCH definition
name: verify
on:
  workflow_run:
    workflows: [measure]
    types: [completed]
permissions:
  contents: read
  actions: read
  statuses: write
  checks: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Verify triggering run (event, repo, path, sha)
        env:
          EV: ${{ github.event.workflow_run.event }}
          PATH_WF: ${{ github.event.workflow_run.path }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONC: ${{ github.event.workflow_run.conclusion }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "DEF=main verify ref=$GITHUB_REF wfsha=$GITHUB_WORKFLOW_SHA ev=$EV path=$PATH_WF head=$HEAD_SHA repo=$HEAD_REPO conc=$CONC"
          ctx="policy/ratchet"; state=failure; desc=""
          if [ "$EV" != pull_request ] || [ "$PATH_WF" != .github/workflows/measure.yml ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            desc="untrusted trigger ev=$EV path=$PATH_WF"
          else
            git fetch -q origin "$HEAD_SHA"
            mkdir -p m && gh run download "$RUN_ID" -n measurement -D m || true
            if out="$(HEAD_SHA=$HEAD_SHA TRUST_REF=origin/main MEAS=m/measurement.txt bash policy/verify-ratchet.sh)"; then state=success; fi
            echo "$out"; desc="$(echo "$out" | tr '\n' ' ' | cut -c1-139)"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state="$state" -f context="$ctx" -f description="$desc" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '{id,creator:.creator.login}'
