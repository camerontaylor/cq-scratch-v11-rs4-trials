# CONTROL = today's toolkit shape: push-triggered gate with a repo-level secret
name: gate-push
on:
  push:
    branches: [merge-queue]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - env: { T: "${{ secrets.REPO_CANARY }}" }
        run: echo "DEF=main gate-push canary_sha=$(printf %s "$T" | sha256sum | cut -c1-12) len=${#T}"
