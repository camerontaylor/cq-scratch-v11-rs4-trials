name: secret-probe
on: { pull_request: }
permissions: {}
jobs:
  repo-secret:
    runs-on: ubuntu-latest
    steps:
      - env: { T: "${{ secrets.REPO_CANARY }}" }
        run: echo "DEF=ATTACK probe repo canary_sha=$(printf %s "$T" | sha256sum | cut -c1-12) len=${#T}"
  env-secret:
    runs-on: ubuntu-latest
    environment: promote
    steps:
      - env: { T: "${{ secrets.ENV_CANARY }}" }
        run: echo "DEF=ATTACK probe env canary len=${#T}"
