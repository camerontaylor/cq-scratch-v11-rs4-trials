# (ii) measurement leg: pull_request, credential-free (permissions: {}), output = untrusted artifact
name: measure
on:
  pull_request:
permissions: {}
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: echo "DEF=main measure"; ./measure.sh > measurement.txt; cat measurement.txt
      - uses: actions/upload-artifact@v4
        with: { name: measurement, path: measurement.txt }
